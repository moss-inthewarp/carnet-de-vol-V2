<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163f43"><meta name="apple-mobile-web-app-capable" content="yes"><title>Carnet de vol</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4ee;color:#163737;font:16px/1.5 system-ui,sans-serif}header{
 background-color:#19282d;
 background-image:linear-gradient(90deg,#142126 0%,rgba(20,33,38,.94) 23%,rgba(20,33,38,.35) 54%,transparent 78%),url('./c130j-bandeau.jpg');
 background-repeat:no-repeat;
 background-position:center,right 42%;
 background-size:cover,max(72%,560px) auto;
 color:#f8f8ec;padding:2.4rem max(5vw,calc((100% - 1050px)/2)) 2rem;border-bottom:5px solid #f0b76b}header small{font:600 .78rem monospace;letter-spacing:.14em;color:#b9d5cd}h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1;margin:.55rem 0 1.45rem;letter-spacing:-.05em}main{max-width:1090px;margin:auto;padding:1.5rem 20px 4rem}h2{font-size:1.35rem;margin:0 0 .8rem}button,summary{cursor:pointer}button,input,select,textarea{font:inherit;color:inherit}button{background:#fff;border:1px solid #bdcbc5;border-radius:8px;padding:.55rem .9rem;min-height:44px}.primary{background:#ffd197;border:0;color:#263a34;font-weight:700}section,article,dialog{border:1px solid #d4ded6;border-radius:14px;background:#fff;padding:1.1rem;margin-bottom:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:.8rem}.stats{margin-bottom:1.3rem}.stat{background:#fff;border-bottom:3px solid #6f9991;padding:.85rem;border-radius:9px}.stat strong{display:block;font:600 1.9rem monospace;margin-top:.25rem}.stat small,label{font-weight:600}input,select,textarea{display:block;width:100%;min-width:0;padding:.55rem;border:1px solid #b9c9c3;border-radius:6px;background:white;margin:.25rem 0 .65rem}summary{padding:.6rem 0;font-weight:650}dialog{margin:auto;width:min(580px,95vw);max-height:90dvh;overflow:auto}dialog::backdrop{background:#132d32aa}fieldset{border:0;border-top:1px solid #d5ded9;padding:1rem 0 .4rem;margin:0}legend{font-weight:750}article{border-radius:8px;background:#f8faf6;margin:.7rem 0 0}article strong{font-size:1.15rem}p{margin:.5rem 0 .8rem}progress{accent-color:#34766b;width:min(100%,320px)}.actions{display:flex;gap:.6rem;flex-wrap:wrap}.empty{padding:1.2rem 0;text-align:center;color:#526a64}.warn{color:#923e32}label{font-size:.9rem}textarea{resize:vertical}
article.flight-card{background:white;border-radius:14px;border-left:4px solid #147bd1;padding:1rem 1.15rem;overflow-wrap:anywhere}
.flight-head,.fee-row,.stop-row{display:flex;align-items:center;gap:.6rem}
.flight-head,.fee-row{justify-content:space-between;flex-wrap:wrap}
.flight-time{color:#1769ac;font-weight:750;font-variant-numeric:tabular-nums}
.flight-meta{color:#526164}.fee-row{margin:.75rem 0;font-weight:650}
.pending{color:#995000}.received{color:#237246}.no-fee{color:#596363}
.receive{background:#ddf4e5;border:0;color:#216637;border-radius:30px;font-weight:650}
.route-fields{display:grid;gap:.25rem}.stop-row label{flex:1;min-width:0}
@media(max-width:640px){
 header{padding-top:clamp(8.5rem,35vw,14rem);padding-bottom:1rem;
 background-size:cover,100% auto;background-position:center,center 15%;
 background-image:linear-gradient(0deg,rgba(14,26,31,.94),rgba(14,26,31,.8) 30%,transparent 66%),url('./c130j-bandeau.jpg')}
 header small{color:#edf2ef}
}
</style><header><small>C-130J &nbsp; / &nbsp; JOURNAL PERSONNEL</small><h1>Carnet de vol</h1><button class="primary" id="add">＋ Ajouter un vol</button></header><main>
<h2>Bilan des vols</h2><div class="grid stats" id="stats"></div><section><h2>Historique des vols</h2><form id="filters"><label>Rechercher<input type="search" name="search" placeholder="Lieu, équipage, numéro de mission…"></label><details><summary>Filtres</summary><div class="grid" id="filterFields"></div><button class="primary" type="submit">Appliquer les filtres</button> <button type="reset">Réinitialiser les filtres</button></details></form><div id="history"></div></section>
<section><h2>Heures</h2>
<div class="grid"><label>Année<select id="fleetYear"><option value="">Toutes les années</option></select></label>
<label>Mois<select id="fleetMonth"><option value="">Tous les mois</option></select></label>
<label>Type d’appareil<select id="fleetAircraft"><option value="">Tous les appareils</option></select></label></div><div id="fleet"></div></section><section><details><summary>Sauvegarde du carnet</summary><p>Les vols sont enregistrés sur cet appareil. Exporte une copie pour les conserver ou les transférer.</p><button id="backup">Exporter les vols</button> <label>Importer une sauvegarde web<input id="restore" type="file" accept=".json,application/json"></label></details></section></main>
<dialog id="editor"><form id="flight"><h2>Fiche de vol</h2><div id="fields"></div><div class="actions"><button class="primary">Enregistrer</button><button type="button" id="cancel">Annuler</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const aircraft=['C130J-30','KC130J','Autre'],missions=['Entraînement','Air transport','Air drop','HAAR','JVN','MEDEVAC','Tactical Flight','Autre'],roles=['ALM-S','ALM','TLM','TLM-S','ACM','CP','PIC'],fees=['Sans frais','En attente','Reçus'];
const groups=[
 ['Mission',[['start','Date de départ','date'],['end','Date de fin','date'],['number','Numéro de mission'],['serviceCode','Code Service Aérien',['22','10']],['plane','Appareil',aircraft],['mission','Type de mission',missions]]],
 ['Temps de vol',[['hours','Heures','number',0,99999],['minutes','Minutes','number',0,59],['sectors','Secteurs','number',0,30]]],
 ['Équipage',[['role','Fonction',roles]]],
 ['Trajet',[['departure','Départ'],['arrival','Arrivée']]],
 ['Suivi',[['fee','Frais de mission',fees],['notes','Remarques','textarea']]]];
const key='carnet.vol.v2.'+location.pathname.replace(/index\.html$/,'');
const form=$('flight'),filters=$('filters');
let editing=null;
function element(tag,txt){const node=document.createElement(tag);if(txt!==undefined)node.textContent=txt;return node}
function field(parent,[name,title,type,min,max],optional=false){
 const label=element('label',title);const select=Array.isArray(type);
 const control=element(select?'select':type==='textarea'?'textarea':'input');
 control.name=name;
 if(select){if(name==='serviceCode'){const empty=new Option('À renseigner','');empty.disabled=true;empty.defaultSelected=true;control.add(empty)}for(const value of type)control.add(new Option(value||'Tous',value))}
 else if(type!=='textarea')control.type=type||'text';
 if(type==='number'){control.min=min;control.max=max;control.step=1}
 control.required=!optional&&(type==='date'||type==='number');
 label.append(control);parent.append(label)
}
const stopList=element('div');
function appendStop(value=''){
 const row=element('div'),label=element('label','Escale'),input=element('input');
 const remove=element('button','Retirer');
 row.className='stop-row';input.value=value;remove.type='button';
 remove.setAttribute('aria-label','Retirer cette escale');
 remove.onclick=()=>row.remove();
 label.append(input);row.append(label,remove);stopList.append(row);
 return input;
}
for(const [title,fields] of groups){const box=element('fieldset'),grid=element('div');grid.className='grid';box.append(element('legend',title),grid);if(title==='Trajet'){
 grid.className='route-fields';field(grid,fields[0]);
 const addStop=element('button','＋ Ajouter une escale');addStop.type='button';
 addStop.onclick=()=>appendStop().focus();grid.append(stopList,addStop);
 field(grid,fields[1]);
 }else fields.forEach(f=>field(grid,f));
 $('fields').append(box)}
for(const f of [['plane','Appareil',['',...aircraft]],['mission','Mission',['',...missions]],['fee','Frais',['',...fees]],['from','Du','date'],['to','Au','date']])field($('filterFields'),f,true);
function records(){const data=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(data))throw Error();return data}
function change(update){try{localStorage.setItem(key,JSON.stringify(update(records())));render();return true}catch{alert('Écriture impossible. Vérifie le stockage disponible.');return false}}
function dateText(s){return s.split('-').reverse().join('/')}
function duration(m){return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')}
function total(f){return Number(f.hours)*60+Number(f.minutes)}
const yearSelect=$('fleetYear'),monthSelect=$('fleetMonth');
const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
months.forEach((name,i)=>monthSelect.add(new Option(name,String(i+1).padStart(2,'0'))));
const aircraftSelect=$('fleetAircraft');
for(const plane of aircraft)aircraftSelect.add(new Option(plane,plane));
yearSelect.onchange=monthSelect.onchange=aircraftSelect.onchange=render;
function renderFleet(all){
 const previousYear=yearSelect.value;
 const years=[...new Set(all.map(f=>f.start.slice(0,4)))].sort().reverse();
 yearSelect.replaceChildren(new Option('Toutes les années',''),...years.map(year=>new Option(year,year)));
 if(years.includes(previousYear))yearSelect.value=previousYear;
 const selected=all.filter(f=>(!yearSelect.value||f.start.slice(0,4)===yearSelect.value)&&
   (!monthSelect.value||f.start.slice(5,7)===monthSelect.value)&&
   (!aircraftSelect.value||f.plane===aircraftSelect.value));
 const fleet=$('fleet');
 fleet.replaceChildren();
 const minutes=selected.reduce((n,f)=>n+total(f),0);
 const label=aircraftSelect.value||'Tous les appareils';
 fleet.append(element('p',label),element('strong',duration(minutes)));
}
function feeRow(f){
 const row=element('div');row.className='fee-row';
 const pending=f.fee==='En attente',received=f.fee==='Reçus';
 const label=element('span',pending?'◷  Frais en attente':received?'✓  Frais reçus':'Sans frais');
 label.className=pending?'pending':received?'received':'no-fee';
 row.append(label);
 if(pending){
   const button=element('button','Marquer reçus');
   button.type='button';button.className='receive';
   button.onclick=()=>change(list=>list.map(vol=>vol.id===f.id&&vol.fee==='En attente'?{...vol,fee:'Reçus'}:vol));
   row.append(button);
 }
 return row;
}
let appliedFilters=null;
function render(){
 let all;try{all=records()}catch{$('history').textContent='Le stockage du carnet est inaccessible.';return}
 const q=appliedFilters||{};const search=filters.elements.search.value.trim().toLocaleLowerCase('fr');
 const rows=all.filter(f=>
 (!q.plane||q.plane===f.plane)&&(!q.mission||q.mission===f.mission)&&(!q.fee||q.fee===f.fee)&&(!q.from||f.end>=q.from)&&(!q.to||f.start<=q.to)&&Object.values(f).join(' ').toLocaleLowerCase('fr').includes(search)).sort((a,b)=>b.start.localeCompare(a.start));
 const sum=all.reduce((n,f)=>n+total(f),0);
 $('stats').replaceChildren();
 for(const [label,v] of [['Heures de vol',duration(sum)],['Vols',all.length],['Secteurs',all.reduce((n,f)=>n+Number(f.sectors),0)],['Frais en attente',all.filter(f=>f.fee==='En attente').length]]){
 const tile=element('div');tile.className='stat';const value=element('strong',v);
 if(label==='Frais en attente'&&v>0)value.className='pending';
 tile.append(element('small',label),value);$('stats').append(tile)}
 $('history').replaceChildren();
 renderFleet(all);
 if((!search&&!appliedFilters)||!rows.length){
   const message=!all.length?'Ton carnet est vide. Ajoute ton premier vol pour commencer.':
     (search||appliedFilters)?'Aucun vol ne correspond à cette sélection.':'Saisis une recherche ou applique les filtres pour afficher tes vols.';
   const hint=element('p',message);
   hint.className='empty';
   $('history').append(hint);
   return;
 }
 for(const f of rows){
 const card=element('article');card.className='flight-card';
 const head=element('div');head.className='flight-head';
 const dates=dateText(f.start)+(f.end===f.start?'':' → '+dateText(f.end));
 const time=element('span',String(f.hours).padStart(2,'0')+':'+String(f.minutes).padStart(2,'0'));
 time.className='flight-time';head.append(element('strong',dates),time);
 const meta=element('p',[f.plane,f.mission,f.number&&'N° '+f.number].filter(Boolean).join(' · '));
 meta.className='flight-meta';
 card.append(head,meta,element('p',f.role+' · '+f.sectors+' secteur(s)'));
 if(f.departure||f.arrival||f.stops?.length){
   card.append(element('p',[f.departure||'—',...(f.stops||[]),f.arrival||'—'].join(' → ')));
 }
 card.append(feeRow(f));
 const edit=element('button','Modifier'),del=element('button','Supprimer');del.className='warn';edit.onclick=()=>openFlight(f);del.onclick=()=>{if(confirm('Supprimer ce vol du carnet ?'))change(list=>list.filter(x=>x.id!==f.id))};const buttons=element('div');buttons.className='actions';buttons.append(edit,del);card.append(buttons);$('history').append(card)}
}
function openFlight(f){const now=new Date();const today=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,10);editing=f?.id||null;form.reset();
 const roleSelect=form.elements.role;
 roleSelect.querySelector('[data-legacy]')?.remove();
 if(f?.role && !roles.includes(f.role)){
  const previous=new Option(f.role,f.role);
  previous.dataset.legacy='';
  roleSelect.add(previous);
 }
 stopList.replaceChildren();for(const stop of f?.stops||[])appendStop(stop);const values=f||{departure:'Evreux',arrival:'Evreux',serviceCode:'22',start:today,end:today,hours:1,minutes:0,sectors:1,role:'ALM'};for(const [k,v] of Object.entries(values)){if(form.elements[k])form.elements[k].value=v}form.elements.end.min=form.elements.start.value;$('editor').showModal()}
form.elements.start.onchange=()=>{const {start,end}=form.elements;end.min=start.value;if(end.value<start.value)end.value=start.value};
form.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form));f.stops=Array.from(stopList.querySelectorAll("input"),input=>input.value.trim()).filter(Boolean);f.id=editing||crypto.randomUUID();if(change(list=>[...list.filter(x=>x.id!==f.id),{...list.find(x=>x.id===f.id),...f}]))$('editor').close()};
$('add').onclick=()=>openFlight();$('cancel').onclick=()=>$('editor').close();filters.elements.search.oninput=render;
filters.onsubmit=e=>{
 e.preventDefault();
 appliedFilters=Object.fromEntries(new FormData(filters));
 render();
};
filters.onreset=()=>{appliedFilters=null;setTimeout(render)};window.addEventListener('storage',render);
$('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,flights:records()},null,2)],{type:'application/json'}));const a=element('a');a.href=url;a.download='carnet-de-vol.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
function valid(f){return f&&typeof f.id==='string'&&f.id.length>0&&(f.stops===undefined||(Array.isArray(f.stops)&&f.stops.every(stop=>typeof stop==="string")))&&groups.every(([,fields])=>fields.every(([k,,type,min,max])=>{const v=f[k];if(k==='serviceCode'&&(v===undefined||v===''))return true;if(typeof v!=='string')return false;if(Array.isArray(type))return type.includes(v);if(type==='number')return /^\d+$/.test(v)&&Number(v)>=min&&Number(v)<=max;if(type==='date')return /^\d{4}-\d\d-\d\d$/.test(v)&&new Date(v).toISOString().slice(0,10)===v;return true}))&&f.end>=f.start}
$('restore').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!Array.isArray(data.flights)||!data.flights.every(valid))throw Error();if(confirm('Importer '+data.flights.length+' vol(s) ? Les fiches de même identifiant seront mises à jour.'))change(list=>Array.from(new Map([...list,...data.flights].map(f=>[f.id,f])).values()))}catch{alert('Cette sauvegarde web est illisible.')}finally{e.target.value=''}};
render();
</script></html>
